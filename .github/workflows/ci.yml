name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and real-library interop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: interop/go/go.mod # the newest Go any module here needs
          cache-dependency-path: |
            go.sum
            interop/go/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interop/node/package-lock.json
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Interop (node-saml, openid-client, MCP SDK, crewjam/saml, go-oidc)
        run: interop/run.sh

  platform:
    name: Docker image checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Race detector, API token mode, persistence, hostile input
        run: interop/platform.sh

  image:
    name: Publish image to GHCR and Docker Hub
    needs: [test, platform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/ssojethq/mock-idp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: README for Docker Hub
        if: github.ref == 'refs/heads/main'
        # Docker Hub only completes Markdown image links, not HTML ones, cannot
        # draw Mermaid, has no heading anchors, and leaves Markdown inside
        # GitHub alerts unrendered, so those become plain quotes.
        run: |
          sed -e 's#src="docs/#src="https://raw.githubusercontent.com/${{ github.repository }}/main/docs/#g' \
              -e 's#href="LICENSE"#href="https://github.com/${{ github.repository }}/blob/main/LICENSE"#g' \
              -e '/^```mermaid$/,/^```$/d' \
              -e '/href="#-/d' \
              -e 's/^> \[!TIP\]$/> 💡 **Tip**\n>/' \
              -e 's/^> \[!NOTE\]$/> ℹ️ **Note**\n>/' \
              -e 's/^> \[!WARNING\]$/> ⚠️ **Warning**\n>/' \
              -e 's/^> \[!CAUTION\]$/> 🛑 **Caution**\n>/' \
              README.md > "$RUNNER_TEMP/README.dockerhub.md"
      - name: Docker Hub description from the README
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ssojethq/mock-idp
          short-description: Okta, Entra ID, Google and 6 more IdPs on your laptop. SAML, OIDC, SCIM, 40 faults.
          readme-filepath: ${{ runner.temp }}/README.dockerhub.md
          enable-url-completion: true
